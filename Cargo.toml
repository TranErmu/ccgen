[package]
name = "ccgen"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ignore = "0.4"
walkdir = "2"
serde_json = "1"
anyhow = "1"
glob = "0.3"
dunce = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

